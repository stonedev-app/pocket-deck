name: IDF Cache Test

# ESP-IDF のインストールをキャッシュで短縮できるかの検証用(確認後に削除する)
on:
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore ESP-IDF cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/esp
            ~/.espressif
          key: idf-v5.5.6-${{ runner.os }}

      - name: Show cache result
        run: echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.6

      - name: Check idf.py
        run: idf.py --version

      - name: Build
        run: idf.py build

      - name: Show sizes
        run: du -sh /tmp/esp ~/.espressif
